name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
        # 版本取自 package.json 的 packageManager（217 波 pnpm 12.5 升级后与硬编码 11.4.0 冲突——
        # 该矛盾只在 tag push 引爆；action-setup v6 会校验两者一致）

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugin.json').version")"

          if [[ "$GITHUB_REF_NAME" != v* || -z "$tag_version" ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected v<version>)"
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)"
            exit 1
          fi

          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Tag version ($tag_version) does not match plugin.json ($plugin_version)"
            exit 1
          fi

          echo "Release version validated: $tag_version"

      - name: Check source
        run: pnpm check

      # REL-04（269 波）：tag 工作流门禁与 CI 对齐——单测/加载语义不过不放行
      - name: Unit tests
        run: pnpm test

      - name: Verify loader semantics
        run: node scripts/verify-loader-semantics.mjs

      - name: Build production package
        run: |
          pnpm build
          cd dist
          zip -r ../package.zip ./*

      # REL-04：包内容/体积门禁（必需文件、禁入文件泄漏、i18n 键位、体积预算与 CI 同标）
      - name: Package smoke test
        run: pnpm run smoke

      - name: Bundle size gate (index.js gzip < 220KB, single-file mandatory)
        run: |
          SIZE=$(gzip -c dist/index.js | wc -c)
          echo "index.js gzip: $SIZE bytes"
          if [ "$SIZE" -gt 225280 ]; then
            echo "::error::index.js gzip exceeds 220KB budget"
            exit 1
          fi

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "package.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
