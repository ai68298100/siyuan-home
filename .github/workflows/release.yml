name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
        # 版本取自 package.json 的 packageManager，避免 CI 与发布流程漂移。

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugin.json').version")"

          if [[ "$GITHUB_REF_NAME" != v* || -z "$tag_version" ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected v<version>)"
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)"
            exit 1
          fi

          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Tag version ($tag_version) does not match plugin.json ($plugin_version)"
            exit 1
          fi

          echo "Release version validated: $tag_version"

      - name: Check source
        run: pnpm check

      # 发布门禁与 CI 对齐；单测失败时不创建 release。
      - name: Unit tests
        run: pnpm test


      - name: Build production package
        run: |
          pnpm build
          cd dist
          zip -r ../package.zip ./*

      # 包内容/体积门禁（必需文件、禁入文件泄漏、i18n 键位与体积预算）。
      - name: Verify loader semantics
        run: node scripts/verify-loader-semantics.mjs

      - name: Package smoke test
        run: pnpm run smoke

      - name: Bundle size gate (index.js gzip < 220KB, single-file mandatory)
        run: |
          SIZE=$(gzip -c dist/index.js | wc -c)
          echo "index.js gzip: $SIZE bytes"
          if [ "$SIZE" -gt 225280 ]; then
            echo "::error::index.js gzip exceeds 220KB budget"
            exit 1
          fi

      - name: Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "package.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
