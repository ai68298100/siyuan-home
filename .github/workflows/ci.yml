# CI：PR 与 push 的质量门禁（TODO 25：check + build + smoke/包体检查）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段唯一声明（避免双源冲突）

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (types + svelte + i18n + meta)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Package smoke test
        run: pnpm run smoke

      # v0.3.1 起 chunks 分包被禁（思源加载器相对 require 必然失败，见 smoke/verify:loader 门禁），
      # 单文件 bundle 即全部体积——预算 225 波标定 200KB；250–267 波 UI 对齐（趋势条/设置第四屏/打印/QR 页等）
      # 增至 ~204.6KB（269 波实测），预算上调至 220KB 并保留 10% 余量；再触发应评估代码分割
      - name: Bundle size gate (index.js gzip < 220KB, single-file mandatory)
        run: |
          SIZE=$(gzip -c dist/index.js | wc -c)
          echo "index.js gzip: $SIZE bytes"
          if [ "$SIZE" -gt 225280 ]; then
            echo "::error::index.js gzip exceeds 220KB budget"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package.zip
          retention-days: 14
